<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Listing Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f2;color:#1a1a1a;padding:20px 24px}
h1{font-size:20px;font-weight:500;margin-bottom:3px}
.subtitle{font-size:13px;color:#888;margin-bottom:18px}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px}
.metric{background:#fff;border-radius:10px;padding:12px 14px;border:0.5px solid #e0e0dc}
.metric-label{font-size:11px;color:#888;margin-bottom:3px}
.metric-value{font-size:22px;font-weight:500}
.metric-sub{font-size:11px;color:#aaa;margin-top:1px}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filters label{font-size:13px;color:#666}
select,button{font-size:12px;padding:5px 9px;border:0.5px solid #ccc;border-radius:6px;background:#fff;cursor:pointer}
button:hover{background:#f0f0ee}
.table-wrap{background:#fff;border-radius:12px;border:0.5px solid #e0e0dc;overflow:hidden;overflow-x:auto;margin-bottom:0}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:1050px}
th{font-weight:500;font-size:11px;color:#888;text-align:left;padding:7px 8px;border-bottom:0.5px solid #e8e8e4;background:#fafaf8;white-space:nowrap;line-height:1.3}
th.group-header{background:#f0f0ee;color:#555;font-size:10px;text-transform:uppercase;letter-spacing:.04em;text-align:center;border-bottom:0.5px solid #ddd}
td{padding:8px 8px;border-bottom:0.5px solid #e8e8e4;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f7f7f4;cursor:pointer}
tr.sel td{background:#eaf1fb!important}
.token-name{font-weight:600;font-size:13px}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:500;white-space:nowrap;line-height:1.5}
.b-yes{background:#eaf3de;color:#3b6d11}
.b-no{background:#f1efe8;color:#5f5e5a}
.b-pending{background:#faeeda;color:#854f0b}
.b-warn{background:#faece7;color:#993c1d}
.b-na{background:#f1efe8;color:#aaa}
.b-noaccess{background:#fbeaf0;color:#993556}
.b-rejected{background:#fcebeb;color:#a32d2d}
.bar-wrap{background:#ebebea;border-radius:4px;height:5px;width:50px;display:inline-block;vertical-align:middle}
.bar-fill{height:5px;border-radius:4px}
.detail{background:#fff;border:0.5px solid #e0e0dc;border-radius:12px;padding:16px 20px;margin-top:12px;display:none}
.detail h2{font-size:15px;font-weight:500;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.detail-sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.dsec h3{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;padding-bottom:4px;border-bottom:0.5px solid #eee}
.drow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:0.5px solid #f0f0ee;gap:8px}
.drow:last-child{border-bottom:none}
.drow span:first-child{font-size:12px;color:#666;flex-shrink:0}
.notes-box{background:#f5f5f2;border-radius:8px;padding:9px 12px;font-size:12px;color:#666;margin-top:12px;line-height:1.5}
.close-x{background:none;border:none;font-size:20px;color:#999;cursor:pointer;line-height:1;padding:0}
.prog-wrap{display:flex;align-items:center;gap:5px}
.col-divider{border-left:1.5px solid #e8e8e4!important}
</style>
</head>
<body>
<h1>🪙 Token listing tracker</h1>
<p class="subtitle">Foundry United / Elevate ecosystem &mdash; Last updated: Sept 18, 2026 &mdash; <span id="token-count"></span></p>

<div class="summary-grid" id="summary-grid"></div>

<div class="filters">
  <label>Filter:</label>
  <select id="filter-status" onchange="applyFilters()">
    <option value="all">All tokens</option>
    <option value="complete">Fully listed (CMC + CG)</option>
    <option value="warnings">Has warnings</option>
    <option value="pending">Has pending items</option>
    <option value="noaccess">Has no-access blocks</option>
  </select>
  <select id="filter-cmc" onchange="applyFilters()">
    <option value="all">Any CMC status</option>
    <option value="yes">CMC listed</option>
    <option value="no">CMC not listed</option>
  </select>
  <select id="filter-cg" onchange="applyFilters()">
    <option value="all">Any CG status</option>
    <option value="yes">CG listed</option>
    <option value="no">CG not listed</option>
  </select>
  <button onclick="resetFilters()">↺ Reset</button>
  <span id="filter-count" style="font-size:12px;color:#888;margin-left:4px"></span>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th rowspan="2" style="min-width:70px">Token</th>
        <th colspan="2" class="group-header">Exchange listings</th>
        <th colspan="2" class="group-header col-divider">Warnings</th>
        <th colspan="3" class="group-header col-divider">On CMC — explorer links</th>
        <th colspan="3" class="group-header col-divider">Updated with logo, etc.</th>
        <th rowspan="2" style="min-width:65px">Progress</th>
      </tr>
      <tr>
        <th>CMC</th>
        <th>CG</th>
        <th class="col-divider">CMC warnings</th>
        <th>CG warnings</th>
        <th class="col-divider">ElevateScan</th>
        <th>Basescan</th>
        <th>BscScan</th>
        <th class="col-divider">Etherscan</th>
        <th>Basescan</th>
        <th>BscScan</th>
      </tr>
    </thead>
    <tbody id="token-tbody"></tbody>
  </table>
</div>

<div class="detail" id="detail-panel"></div>

<script>
const tokens=[
  {
    id:'GREEN',
    cmc:'yes',cg:'yes',cmcWarn:'no',cgWarn:'warn',cgWarnDetail:'GoPlus',
    cmcElev:'yes',cmcBase:'pending',cmcBsc:'pending',
    logoEther:'yes',logoBase:'pending',logoBsc:'no',
    baseDate:'7/7/26',bscDate:'7/7/26',logoBaseDate:'7/7/26',
    notes:'Basescan & BscScan submitted to CMC on 7/7/26. Logo/Basescan submitted 7/7/26. BscScan logo not yet done. CG GoPlus warning active.'
  },
  {
    id:'WIN',
    cmc:'yes',cg:'yes',cmcWarn:'no',cgWarn:'warn',cgWarnDetail:'GoPlus',
    cmcElev:'yes',cmcBase:'yes',cmcBsc:'yes',
    logoEther:'yes',logoBase:'yes',logoBsc:'noaccess',
    notes:'Fully listed and CMC explorer links confirmed. No BscScan logo access. CG GoPlus warning active.'
  },
  {
    id:'RALLY',
    cmc:'yes',cg:'yes',cmcWarn:'no',cgWarn:'pending',cgWarnDetail:'Submitted 6/23/26',
    cmcElev:'yes',cmcBase:'yes',cmcBsc:'yes',
    logoEther:'yes',logoBase:'yes',logoBsc:'pending',
    logoBscDate:'6/17/26',
    notes:'CG warning submission pending since 6/23/26. BscScan logo submitted 6/17/26 — awaiting approval. Otherwise fully listed.'
  },
  {
    id:'GROW',
    cmc:'yes',cg:'yes',cmcWarn:'no',cgWarn:'warn',cgWarnDetail:'GoPlus',
    cmcElev:'yes',cmcBase:'yes',cmcBsc:'yes',
    logoEther:'yes',logoBase:'yes',logoBsc:'noaccess',
    notes:'Fully listed. All CMC explorer links confirmed. No BscScan logo access. CG GoPlus warning active.'
  },
  {
    id:'SWITCH',
    cmc:'yes',cg:'yes',cmcWarn:'no',cgWarn:'no',
    cmcElev:'yes',cmcBase:'pending',cmcBsc:'pending',
    logoEther:'yes',logoBase:'yes',logoBsc:'no',
    baseDate:'7/7/26',bscDate:'7/7/26',
    notes:'Basescan & BscScan submitted to CMC on 7/7/26. Logo updated on Basescan. BscScan logo not done. No warnings — cleanest status.'
  },
  {
    id:'ELMT',
    cmc:'yes',cg:'yes',cmcWarn:'no',cgWarn:'no',
    cmcElev:'yes',cmcBase:'yes',cmcBsc:'yes',
    logoEther:'yes',logoBase:'no',logoBsc:'noaccess',
    notes:'Fully listed on CMC and CG with all explorer links. No warnings. Basescan logo not updated. No BscScan logo access.'
  },
  {
    id:'GALVAN',
    cmc:'yes',cg:'yes',cmcWarn:'yes',cgWarn:'no',
    cmcElev:'yes',cmcBase:'no',cmcBsc:'no',
    logoEther:'yes',logoBase:'no',logoBsc:'no',
    notes:'CMC warnings present — needs review. No Basescan or BscScan on CMC. Logo only updated on Etherscan.'
  },
  {
    id:'ELEVATE',
    cmc:'yes',cg:'rejected',cmcWarn:'no',cgWarn:'na',
    cmcElev:'yes',cmcBase:'pending',cmcBsc:'pending',
    logoEther:'noaccess',logoBase:'pending',logoBsc:'noaccess',
    baseDate:'7/7/26',bscDate:'7/7/26',logoBaseDate:'6/16/26',
    notes:'CG listing rejected — Not Applied. Basescan & BscScan submitted to CMC on 7/7/26. Basescan logo submitted 6/16/26. No Etherscan or BscScan logo access.'
  },
  {
    id:'GULD',
    cmc:'yes',cg:'yes',cmcWarn:'no',cgWarn:'no',
    cmcElev:'yes',cmcBase:'yes',cmcBsc:'yes',
    logoEther:'yes',logoBase:'noaccess',logoBsc:'noaccess',
    notes:'Fully listed, all CMC explorer links confirmed. No warnings. No logo access on Basescan or BscScan.'
  },
  {
    id:'GIVE',
    cmc:'yes',cg:'no',cmcWarn:'no',cgWarn:'na',
    cmcElev:'pending',cmcBase:'yes',cmcBsc:'pending',
    logoEther:'yes',logoBase:'yes',logoBsc:'noaccess',
    elevDate:'6/19/26',bscDate:'6/19/26',
    notes:'CG listing not applied for. ElevateScan & BscScan submitted to CMC on 6/19/26 — pending. Basescan confirmed. No BscScan logo access.'
  },
  {
    id:'LIBERTY',
    cmc:'no',cg:'no',cmcWarn:'na',cgWarn:'na',
    cmcElev:'na',cmcBase:'na',cmcBsc:'na',
    logoEther:'no',logoBase:'no',logoBsc:'noaccess',
    notes:'Not yet listed on CMC or CG. No explorer links. No logo work done. Full listing process needs to be initiated.'
  },
  {
    id:'CODEX',
    cmc:'yes',cg:'no',cmcWarn:'no',cgWarn:'na',
    cmcElev:'yes',cmcBase:'yes',cmcBsc:'yes',
    logoEther:'noaccess',logoBase:'noaccess',logoBsc:'noaccess',
    notes:'CMC listed with all explorer links. CG not yet listed. No logo access on any explorer.'
  },
];

function score(t){
  let s=0,tot=10;
  if(t.cmc==='yes') s+=2;
  if(t.cg==='yes') s+=2;
  if(t.cmcElev==='yes') s+=1; else if(t.cmcElev==='pending') s+=0.5;
  if(t.cmcBase==='yes') s+=1; else if(t.cmcBase==='pending') s+=0.5;
  if(t.cmcBsc==='yes') s+=1; else if(t.cmcBsc==='pending') s+=0.5;
  if(t.logoEther==='yes') s+=1; else if(t.logoEther==='noaccess') s+=0.5;
  if(t.logoBase==='yes') s+=1; else if(t.logoBase==='pending') s+=0.5; else if(t.logoBase==='noaccess') s+=0.5;
  if(t.logoBsc==='yes') s+=1; else if(t.logoBsc==='pending') s+=0.5; else if(t.logoBsc==='noaccess') s+=0.5;
  if(t.cmcWarn==='yes') s-=1;
  if(t.cgWarn==='warn') s-=0.5;
  return Math.max(0,Math.min(1,s/tot));
}

function badge(val,detail){
  if(!val||val===''||val==='—') return '<span class="badge b-na">—</span>';
  const v=String(val).toLowerCase().trim();
  if(v==='yes') return '<span class="badge b-yes">Yes</span>';
  if(v==='no') return '<span class="badge b-no">No</span>';
  if(v==='na') return '<span class="badge b-na">N/A</span>';
  if(v==='noaccess') return '<span class="badge b-noaccess">No access</span>';
  if(v==='rejected') return '<span class="badge b-rejected">Rejected</span>';
  if(v==='pending') {
    const d=detail?` ${detail}`:'';
    return `<span class="badge b-pending">Submitted${d}</span>`;
  }
  if(v==='warn') return `<span class="badge b-warn">${detail||'Warning'}</span>`;
  return `<span class="badge b-pending">${val}</span>`;
}

function pctColor(p){return p>=80?'#639922':p>=50?'#ba7517':'#a32d2d';}

let activeId=null;
let filtered=[...tokens];

function renderSummary(){
  const total=tokens.length;
  const cmc=tokens.filter(t=>t.cmc==='yes').length;
  const cg=tokens.filter(t=>t.cg==='yes').length;
  const warn=tokens.filter(t=>t.cgWarn==='warn'||t.cmcWarn==='yes').length;
  const pend=tokens.filter(t=>
    t.cmcBase==='pending'||t.cmcBsc==='pending'||t.cmcElev==='pending'||
    t.logoBase==='pending'||t.logoBsc==='pending'||t.cgWarn==='pending'
  ).length;
  const noaccess=tokens.filter(t=>
    t.logoEther==='noaccess'||t.logoBase==='noaccess'||t.logoBsc==='noaccess'
  ).length;
  document.getElementById('summary-grid').innerHTML=`
    <div class="metric"><div class="metric-label">Total tokens</div><div class="metric-value">${total}</div></div>
    <div class="metric"><div class="metric-label">CMC listed</div><div class="metric-value">${cmc}</div><div class="metric-sub">of ${total}</div></div>
    <div class="metric"><div class="metric-label">CG listed</div><div class="metric-value">${cg}</div><div class="metric-sub">of ${total}</div></div>
    <div class="metric"><div class="metric-label">Active warnings</div><div class="metric-value" style="color:#a32d2d">${warn}</div></div>
    <div class="metric"><div class="metric-label">Submissions pending</div><div class="metric-value" style="color:#854f0b">${pend}</div></div>
    <div class="metric"><div class="metric-label">No-access blocks</div><div class="metric-value" style="color:#993556">${noaccess}</div></div>
  `;
  document.getElementById('token-count').textContent=`${total} tokens tracked`;
}

function renderTable(){
  document.getElementById('token-tbody').innerHTML=filtered.map(t=>{
    const p=Math.round(score(t)*100);
    const col=pctColor(p);
    const sel=activeId===t.id?'sel':'';
    return `<tr class="${sel}" onclick="toggleDetail('${t.id}')">
      <td><span class="token-name">${t.id}</span></td>
      <td>${badge(t.cmc)}</td>
      <td>${badge(t.cg==='rejected'?'rejected':t.cg)}</td>
      <td class="col-divider">${badge(t.cmcWarn==='yes'?'warn':t.cmcWarn, t.cmcWarn==='yes'?'Yes':'')}</td>
      <td>${badge(t.cgWarn,t.cgWarnDetail)}</td>
      <td class="col-divider">${badge(t.cmcElev,t.elevDate)}</td>
      <td>${badge(t.cmcBase,t.baseDate)}</td>
      <td>${badge(t.cmcBsc,t.bscDate)}</td>
      <td class="col-divider">${badge(t.logoEther)}</td>
      <td>${badge(t.logoBase,t.logoBaseDate)}</td>
      <td>${badge(t.logoBsc,t.logoBscDate)}</td>
      <td>
        <div class="prog-wrap">
          <div class="bar-wrap"><div class="bar-fill" style="width:${p}%;background:${col}"></div></div>
          <span style="font-size:11px;color:#888">${p}%</span>
        </div>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('filter-count').textContent=
    filtered.length<tokens.length?`Showing ${filtered.length} of ${tokens.length}`:'';
}

function toggleDetail(id){
  if(activeId===id){closeDetail();return;}
  activeId=id;
  const t=tokens.find(x=>x.id===id);
  const p=Math.round(score(t)*100);
  const col=pctColor(p);
  const panel=document.getElementById('detail-panel');
  panel.style.display='block';
  panel.innerHTML=`
    <h2>${t.id} — detail <button class="close-x" onclick="closeDetail()" aria-label="Close">×</button></h2>
    <div class="detail-sections">
      <div class="dsec">
        <h3>Exchange listings</h3>
        <div class="drow"><span>CoinMarketCap</span>${badge(t.cmc)}</div>
        <div class="drow"><span>CoinGecko</span>${badge(t.cg==='rejected'?'rejected':t.cg)}</div>
      </div>
      <div class="dsec">
        <h3>Warnings</h3>
        <div class="drow"><span>CMC warnings</span>${badge(t.cmcWarn==='yes'?'warn':t.cmcWarn,t.cmcWarn==='yes'?'Active':'')}</div>
        <div class="drow"><span>CG warnings</span>${badge(t.cgWarn,t.cgWarnDetail)}</div>
      </div>
      <div class="dsec">
        <h3>On CMC — explorer links</h3>
        <div class="drow"><span>ElevateScan</span>${badge(t.cmcElev,t.elevDate)}</div>
        <div class="drow"><span>Basescan</span>${badge(t.cmcBase,t.baseDate)}</div>
        <div class="drow"><span>BscScan</span>${badge(t.cmcBsc,t.bscDate)}</div>
      </div>
      <div class="dsec">
        <h3>Logo / branding updated</h3>
        <div class="drow"><span>Etherscan</span>${badge(t.logoEther)}</div>
        <div class="drow"><span>Basescan</span>${badge(t.logoBase,t.logoBaseDate)}</div>
        <div class="drow"><span>BscScan</span>${badge(t.logoBsc,t.logoBscDate)}</div>
      </div>
    </div>
    <div style="margin-top:14px;display:flex;align-items:center;gap:10px">
      <span style="font-size:12px;color:#666">Overall progress</span>
      <div class="bar-wrap" style="width:180px"><div class="bar-fill" style="width:${p}%;background:${col}"></div></div>
      <span style="font-size:13px;font-weight:500">${p}%</span>
    </div>
    <div class="notes-box">📝 ${t.notes}</div>
  `;
  renderTable();
  panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function closeDetail(){
  activeId=null;
  document.getElementById('detail-panel').style.display='none';
  renderTable();
}

function applyFilters(){
  const st=document.getElementById('filter-status').value;
  const fc=document.getElementById('filter-cmc').value;
  const fg=document.getElementById('filter-cg').value;
  filtered=tokens.filter(t=>{
    if(fc==='yes'&&t.cmc!=='yes') return false;
    if(fc==='no'&&t.cmc==='yes') return false;
    if(fg==='yes'&&t.cg!=='yes') return false;
    if(fg==='no'&&t.cg==='yes') return false;
    if(st==='complete') return t.cmc==='yes'&&t.cg==='yes'&&t.cmcWarn!=='yes'&&t.cgWarn!=='warn';
    if(st==='warnings') return t.cgWarn==='warn'||t.cmcWarn==='yes';
    if(st==='pending') return [t.cmcElev,t.cmcBase,t.cmcBsc,t.logoBase,t.logoBsc,t.cgWarn].some(v=>v==='pending');
    if(st==='noaccess') return [t.logoEther,t.logoBase,t.logoBsc].some(v=>v==='noaccess');
    return true;
  });
  closeDetail();
}

function resetFilters(){
  document.getElementById('filter-status').value='all';
  document.getElementById('filter-cmc').value='all';
  document.getElementById('filter-cg').value='all';
  filtered=[...tokens];
  closeDetail();
}

renderSummary();
renderTable();
</script>
</body>
</html>
